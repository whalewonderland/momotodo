<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クエストTODO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 text-slate-800">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- ポイント＆ご褒美ヘッダー -->
    <div class="bg-gradient-to-r from-amber-500 to-red-500 rounded-2xl p-4 text-white shadow-lg">
      <div class="flex justify-between items-center mb-1">
        <span class="font-bold text-xs tracking-wider uppercase opacity-90">獲得討伐pt</span>
        <span id="score" class="text-3xl font-black">0 pt</span>
      </div>
      <div class="w-full bg-black/20 rounded-full h-3 overflow-hidden p-0.5">
        <div id="progress" class="bg-yellow-300 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
      <p id="reward-msg" class="text-xs text-right mt-1.5 font-bold text-yellow-100">次のご褒美（100pt）まであと 100pt</p>
    </div>

    <!-- 入力フォーム -->
    <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
      <h2 class="font-bold text-base border-b pb-2 flex items-center gap-2">
        <span>⚔️</span> クエストを発行（タスク追加）
      </h2>
      
      <div>
        <label class="text-xs font-bold text-slate-500">内容</label>
        <input id="task-title" type="text" placeholder="例: 経費精算の書類を提出する" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-bold text-slate-500">見込み時間</label>
          <select id="task-time" class="w-full border rounded-lg p-2.5 text-sm bg-white">
            <option value="15">15分</option>
            <option value="30" selected>30分</option>
            <option value="60">60分</option>
            <option value="90">90分</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-bold text-slate-500">カテゴリ</label>
          <select id="task-cat" class="w-full border rounded-lg p-2.5 text-sm bg-white">
            <option value="仕事">💼 仕事</option>
            <option value="家">🏠 家</option>
            <option value="自分">👤 自分</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-500">敵の強さ（討伐難易度）</label>
        <select id="task-level" class="w-full border rounded-lg p-2.5 text-sm bg-white font-medium">
          <option value="1">🟢 Lv.1 イフリート級 (x1pt)</option>
          <option value="2">🔵 Lv.2 カマイタチ級 (x2pt)</option>
          <option value="3" selected>🟡 Lv.3 フェニックス級 (x3pt)</option>
          <option value="4">🟠 Lv.4 アメミット級 (x4pt)</option>
          <option value="5">🔴 Lv.5 アザゼル級 (x5pt)</option>
        </select>
      </div>

      <button onclick="addTask()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl shadow active:scale-95 transition mt-2">
        クエストを受注する
      </button>
    </div>

    <!-- タスク一覧 -->
    <div class="space-y-2">
      <h2 class="font-bold text-xs text-slate-500 tracking-wider uppercase">討伐対象のモンスター一覧</h2>
      <div id="task-list" class="space-y-2">
        <!-- ここに動的追加 -->
      </div>
    </div>

  </div>

  <script>
    let score = Number(localStorage.getItem('todo_score') || 0);
    let tasks = JSON.parse(localStorage.getItem('todo_tasks') || '[]');

    const levelData = {
      1: { label: 'Lv.1 イフリート級', color: 'border-emerald-400', badge: 'bg-emerald-100 text-emerald-700' },
      2: { label: 'Lv.2 カマイタチ級', color: 'border-sky-400', badge: 'bg-sky-100 text-sky-700' },
      3: { label: 'Lv.3 フェニックス級', color: 'border-amber-400', badge: 'bg-amber-100 text-amber-700' },
      4: { label: 'Lv.4 アメミット級', color: 'border-orange-500', badge: 'bg-orange-100 text-orange-700' },
      5: { label: 'Lv.5 アザゼル級', color: 'border-red-600', badge: 'bg-red-100 text-red-700 font-bold' }
    };

    function updateUI() {
      // スコアとゲージ
      document.getElementById('score').innerText = `${score} pt`;
      const target = 100;
      const progressPercent = Math.min((score % target) / target * 100, 100);
      document.getElementById('progress').style.width = `${progressPercent}%`;
      
      const remain = target - (score % target);
      document.getElementById('reward-msg').innerText = `次のご褒美（100pt）まであと ${remain}pt`;

      // タスク一覧
      const listEl = document.getElementById('task-list');
      listEl.innerHTML = '';
      
      if(tasks.length === 0) {
        listEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-6">現在出現しているモンスターはいません🎉</p>';
        return;
      }

      tasks.forEach((t, index) => {
        const catColor = t.cat === '仕事' ? 'bg-slate-100 text-slate-700' : t.cat === '家' ? 'bg-indigo-50 text-indigo-600' : 'bg-teal-50 text-teal-600';
        const lvl = levelData[t.level] || levelData[3];
        const pts = t.time * t.level;
        
        const card = document.createElement('div');
        card.className = `bg-white rounded-xl p-3.5 shadow-sm flex items-center justify-between border-l-4 ${lvl.color}`;
        
        card.innerHTML = `
          <div class="space-y-1.5 pr-2 flex-1">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span onclick="editCategory(${index})" title="タップしてカテゴリを変更" class="text-[10px] px-2 py-0.5 rounded-full font-bold cursor-pointer hover:opacity-80 transition ${catColor}">
                ${t.cat} ✏️
              </span>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${lvl.badge}">${lvl.label}</span>
              <span class="text-[11px] text-slate-400 font-medium">⏱ ${t.time}分</span>
            </div>
            <p class="font-bold text-sm text-slate-800">${t.title}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button onclick="cancelTask(${index})" class="text-xs text-slate-400 hover:text-red-500 p-1 transition" title="クエスト辞退">
              辞退
            </button>
            <button onclick="completeTask(${index})" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-black text-xs px-3.5 py-2.5 rounded-xl shadow-sm active:scale-95 transition">
              撃破!<br><span class="text-[10px] opacity-80">+${pts}pt</span>
            </button>
          </div>
        `;
        listEl.appendChild(card);
      });

      localStorage.setItem('todo_score', score);
      localStorage.setItem('todo_tasks', JSON.stringify(tasks));
    }

    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      if(!title) return alert('クエストの内容を入力してください');
      
      const time = Number(document.getElementById('task-time').value);
      const cat = document.getElementById('task-cat').value;
      const level = Number(document.getElementById('task-level').value);

      tasks.push({ title, time, cat, level });
      document.getElementById('task-title').value = '';
      updateUI();
    }

    function editCategory(index) {
      const t = tasks[index];
      const newCat = prompt(`カテゴリを変更しますか？\n（仕事 / 家 / 自分）`, t.cat);
      
      if (newCat && ['仕事', '家', '自分'].includes(newCat.trim())) {
        tasks[index].cat = newCat.trim();
        updateUI();
      } else if (newCat !== null) {
        alert('「仕事」「家」「自分」のいずれかを指定してください。');
      }
    }

    function cancelTask(index) {
      const t = tasks[index];
      const rewardPts = t.time * t.level;
      const penalty = Math.floor(rewardPts * 0.1); // 10%違約金 (切り捨て)

      const confirmMsg = `【クエスト辞退の確認】\n「${t.title}」を辞退しますか？\n\n⚠️ 違約金として ${penalty} pt がマイナスされます。よろしいですか？`;
      
      if (confirm(confirmMsg)) {
        score -= penalty;
        alert(`クエストを辞退しました。\n違約金 ${penalty} pt が引き落とされました。`);
        tasks.splice(index, 1);
        updateUI();
      }
    }

    function completeTask(index) {
      const t = tasks[index];
      const pts = t.time * t.level;
      score += pts;
      
      alert(`⚔️ モンスター撃破！\n${pts} pt 獲得しました！`);
      
      tasks.splice(index, 1);
      updateUI();
    }

    // 初期表示
    updateUI();
  </script>
</body>
</html>
